<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3622 1294" width="362" height="129">
  <title>Jataí</title>
  <!-- Versão horizontal: símbolo Guarda + wordmark "jataí". Proporção da prancha aprovada:
       símbolo 44, nome 34 (1 em), 12 de espaço. -->
  <svg x="0" y="0" width="1294" height="1294" viewBox="0 0 512 512">
    <!-- Símbolo Guarda: a jataí vista de cima. As quatro faixas de mel do abdômen são
         os quatro streams; a ponta redonda é o "sem ferrão". Paleta: Mel #F39A1D,
         Própolis #2C1708, Olho #5B6B2C, Asa #FFF6E2. -->
