# Fixture sintética (F2.3): sprint-backlog.yaml na Forma A (meta: + sprints[].items[])
# com um erro de sintaxe YAML de verdade: um item de dod: que começa com crase
# (indicador reservado) e um dois-pontos dentro. O js-yaml lança no load.
# Conteúdo fictício; só a forma importa para os testes.

meta:
  product: Acme Loja
  code_name: acme-loja
  total_sprints: 2
  sprint_duration_weeks: 2
  team_composition:
    - role: backend
      count: 1
    - role: frontend
      count: 1
  gate_before_downstream: G1
  gate_before_operation: G2

sprints:
