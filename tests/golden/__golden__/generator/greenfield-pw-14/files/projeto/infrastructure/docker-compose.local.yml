version: "3.9"

services:
  api:
    build:
      context: ../code/services/orbita-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=local
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbita
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:
