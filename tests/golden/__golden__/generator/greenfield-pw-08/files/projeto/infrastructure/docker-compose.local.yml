version: "3.9"

services:
  api:
    build:
      context: ../code/services/orbita-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=local
    depends_on:
      - mysql

  mysql:
    image: mysql:8-oracle
    environment:
      MYSQL_DATABASE: orbita
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data:
