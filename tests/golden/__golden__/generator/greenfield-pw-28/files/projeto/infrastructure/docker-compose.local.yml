version: "3.9"

services:
  api:
    build:
      context: ../code/services/painel-ficticio-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=local
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db


volumes:
  mongo_data:
