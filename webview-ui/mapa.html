<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa da colmeia (mock)</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* O app adquire a API no escopo do módulo; o mock a preenche depois. */
      window.acquireVsCodeApi = function () {
        return {
          postMessage: function (msg) { if (window.__jataiMockApi) window.__jataiMockApi.postMessage(msg); },
          getState: function () { return window.__jataiMockApi ? window.__jataiMockApi.getState() : undefined; },
          setState: function (state) { return window.__jataiMockApi ? window.__jataiMockApi.setState(state) : state; },
        };
      };
    </script>
    <script type="module" src="/src/mock/map-main.tsx"></script>
  </body>
</html>
