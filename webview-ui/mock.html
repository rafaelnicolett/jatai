<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helyx Cockpit — sanity check visual (mock)</title>
    <style>
      /* Fora do VS Code não existem --vscode-*; aproxima um tema escuro pra o
         sanity check não renderizar tudo transparente/sem contraste. */
      :root {
        --vscode-editor-background: #1e1e1e;
        --vscode-sideBar-background: #252526;
        --vscode-editorWidget-background: #252526;
        --vscode-list-hoverBackground: #2a2d2e;
        --vscode-button-background: #0e639c;
        --vscode-button-hoverBackground: #1177bb;
        --vscode-button-foreground: #ffffff;
        --vscode-foreground: #cccccc;
        --vscode-descriptionForeground: #9d9d9d;
        --vscode-disabledForeground: #6b6b6b;
        --vscode-widget-border: #454545;
        --vscode-panel-border: #454545;
        --vscode-focusBorder: #0e639c;
        --vscode-badge-background: #4d4d4d;
        --vscode-textLink-foreground: #3794ff;
        --vscode-testing-iconPassed: #73c991;
        --vscode-editorWarning-foreground: #cca700;
        --vscode-editorError-foreground: #f14c4c;
        --vscode-editorInfo-foreground: #3794ff;
        --vscode-charts-green: #73c991;
        --vscode-charts-yellow: #cca700;
        --vscode-charts-red: #f14c4c;
        --vscode-charts-blue: #3794ff;
        --vscode-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --vscode-editor-font-family: "SF Mono", Menlo, monospace;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mock-main.tsx"></script>
  </body>
</html>
